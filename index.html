<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todo-list</title>
<style>
body {
      background-color: #d1d934; 
      color: #429857;        
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 50px;
    }
h1 {
            color: #333;
            text-align: center;
        }
 #todo-input {
            width: 70%;
            padding: 10px;
            font-size: 16px;
        }
 #add-btn {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
#add-btn:hover {
            background-color: #45a049;
        }

 #todo-list {
            list-style-type: none;
            padding: 0;
        }
        #todo-list li {
            padding: 10px;
            background-color: #f9f9f9;
            margin-bottom: 5px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
        }
        .delete-btn {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }

</style>
</head>
<body>
  <nav aria-label="Blog navigation" style="margin:0 auto 26px;font-size:16px"><a href="blog/" style="color:#263c2b;font-weight:600;text-underline-offset:4px">Tetri Blog · Free Cloud Servers Guide →</a></nav>
  <h1>todo-list</h1>  
<div>
        <input type="text" id="todo-input" placeholder="输入待办事项...">
        <button id="add-btn">添加</button>
    </div>
    <ul id="todo-list"></ul>

    <script>
        // 获取DOM元素
        const todoInput = document.getElementById('todo-input');
        const addBtn = document.getElementById('add-btn');
        const todoList = document.getElementById('todo-list');

        // 添加待办事项
        function addTodo() {
            const todoText = todoInput.value.trim();
            if (todoText !== '') {
                const li = document.createElement('li');
                
                const todoSpan = document.createElement('span');
                todoSpan.textContent = todoText;


const deleteBtn = document.createElement('button');
                deleteBtn.textContent = '删除';
                deleteBtn.className = 'delete-btn';
                deleteBtn.onclick = function() {
                    todoList.removeChild(li);
                };
                
                li.appendChild(todoSpan);
                li.appendChild(deleteBtn);
                todoList.appendChild(li);
                
                todoInput.value = '';
            }
        }

         // 点击添加按钮
        addBtn.addEventListener('click', addTodo);

        // 按回车键添加
        todoInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTodo();
            }
        });
    </script>
</body>
</html>
